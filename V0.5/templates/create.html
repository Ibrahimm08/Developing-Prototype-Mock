<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="../static/styles/style.css">
    <!-- Using same stylesheet as login for familiarity -->
    <link rel="stylesheet" href="../static/styles/login.css">
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <h1>
                <a href="{{ url_for('Index') }}">Rolsa Technology</a>
            </h1>
        </div>
        <div class="links">
            <a href="{{ url_for('Calculate') }}">Calculator</a>
            <a href="{{ url_for('Products') }}">Products</a>
            <a href="{{ url_for('Booking') }}">Bookings</a>
            <a href="">About</a>
            {% if session.user %}
            <a href="{{ url_for('Dashboard') }}">
                <img src="{{ url_for('static', filename='images/account_icon.png') }}" alt="Profile Icon">
            </a>
            {% else %}
            <a href="{{ url_for('Login') }}">
                Login
            </a>
            {% endif %}
        </div>

    </div>

    <div class="login">
        <h1>Sign Up</h1>
        <form action="/create" method="POST">
            <div>
                <label for="firstname">
                    Firstname
                </label>
                <input type="text" name="firstname" required>

                <label for="firstname">
                    Surname
                </label>
                <input type="text" name="surname" required>
            </div>
            <div>
                <label for="email">
                    Email
                </label>
                <input type="email" name="email" required placeholder="account@email.com">
                <label for="password">
                    Password
                </label>
                <input type="password" name="password" required>
            </div>
            <div>
                <button>Sign Up</button>
            </div>
        </form>
    </div>
</body>

</html>

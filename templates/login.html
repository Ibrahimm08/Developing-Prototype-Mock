<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/styles/style.css">
    <link rel="stylesheet" href="../static/styles/login.css">
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <h1>
                <a href="{{ url_for('Index') }}">Rolsa Technology</a>
            </h1>
        </div>
        <div class="links">
            <a href="{{ url_for('Calculate') }}">Calculator</a>
            <a href="{{ url_for('Products') }}">Products</a>
            <a href="{{ url_for('Booking') }}">Bookings</a>
            <a href="">About</a>
            {% if session.user %}
            <a href="{{ url_for('Dashboard') }}">
                <img src="{{ url_for('static', filename='images/account_icon.png') }}" alt="Profile Icon">
            </a>
            {% else %}
            <a href="{{ url_for('Login') }}">
                Login
            </a>
            {% endif %}
        </div>

    </div>

    <div class="login">
        <h1>Login</h1>
        <form action="/login" method="POST">
            <div>
                <label for="username">
                    Username/Email
                </label>
                <input type="email" name="username" required placeholder="account@email.com">
            </div>
            <div>
                <label for="password">
                    Password
                </label>
                <input type="password" name="password" required>
            </div>
            <div>
                <button type="submit">Login</button>
                or
                <a href="{{ url_for('Sign_Up') }}">
                    <button type="button">Sign Up</button>
                </a>
            </div>
        </form>
    </div>
</body>

</html>

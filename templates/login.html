<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/styles/style.css">
    <link rel="stylesheet" href="../static/styles/login.css">
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <h1>
                <a href="index.html">Rolsa Technology</a>
            </h1>
        </div>
        <div class="links">
            <a href="">Calculator</a>
            <a href="products.html">Products</a>
            <a href="booking.html">Bookings</a>
            <a href="">About</a>
            <a href=""><img src="{{url_for('static/images', filename='')}}" alt="Profile Icon"></a>
        </div>

    </div>

    <div class="login">
        <h1>Login</h1>
        <form action="/login" method="POST">
            <div>
                <label for="username">
                    Username/Email
                </label>
                <input type="email" name="username" required placeholder="account@email.com">
            </div>
            <div>
                <label for="password">
                    Password
                </label>
                <input type="password" name="password" required>
            </div>
            <div>
                <button type="submit">Login</button>
                or
                <button type="button">Sign Up</button>
            </div>
        </form>
    </div>
</body>

</html>
